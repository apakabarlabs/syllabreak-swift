name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v7

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Swift version
      run: swift --version

    - uses: actions/setup-python@v7
      with:
        python-version: "3.x"

    - name: Install tools
      run: make install-tools
    
    - name: Build
      run: make build

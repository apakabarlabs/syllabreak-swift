documentation: https://apakabarlabs.github.io/syllabreak-swift/data/documentation/syllabreak.json

skip:
  - .build/

allow:
  - file: Sources/Syllabreak/WordSplitter.swift
    text: |-
      // CJK char ranges baked as literals — ICU doesn't expose Block names
      // in NSRegularExpression. Order matters: the Latin/digit alternative
      // sits first so "iPhoneを使う" keeps "iPhone" intact.
    what_was_tried_and_why_none_of_it_worked:
      "The regex constant and mixed-script corpus test preserve the result, but neither
       records the external ICU limitation that prevents using Unicode Block names or
       why the literal range and alternative order are deliberate."
